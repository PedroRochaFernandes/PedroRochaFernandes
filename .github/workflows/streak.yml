name: Atualizar contador de sequência

on:
  schedule:
    - cron: "0 */4 * * *" # a cada 4 horas
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - scripts/streak.mjs
      - .github/workflows/streak.yml

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar streak.svg
        run: node scripts/streak.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Opcional: crie o secret STREAK_TOKEN (PAT com read:user) para contar
          # também contribuições em repositórios privados.
          GH_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git diff --staged --quiet || (git commit -m "chore: atualiza contador de sequência" && git push)
